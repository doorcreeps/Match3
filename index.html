<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ Три в ряд | Match-3 игра</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            margin: 0;
            padding: 16px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 48px;
            padding: 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .game-panel {
            background: #fef7e0;
            border-radius: 40px;
            padding: 20px;
            box-shadow: inset 0 0 8px #b87c4f, 0 15px 25px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            background-color: #f3e5c0;
            width: 100%;
            height: auto;
            touch-action: none;
        }

        /* Горизонтальное расположение */
        .info {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 20px 0 15px 0;
            width: 100%;
        }

        .score-box {
            background: linear-gradient(135deg, #2c1c12 0%, #3a2518 100%);
            padding: 8px 20px;
            border-radius: 60px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.6rem;
            letter-spacing: 2px;
            box-shadow: inset 0 -2px 0 #5a3a28, 0 5px 10px rgba(0,0,0,0.2);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .score-box span:first-child {
            font-size: 0.9rem;
            color: #f3c26b;
            margin-right: 8px;
        }

        .sound-toggle {
            background: linear-gradient(135deg, #2c1c12 0%, #3a2518 100%);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            color: #ffd966;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 217, 102, 0.3);
            text-align: center;
        }

        .sound-toggle:active {
            transform: scale(0.96);
        }

        .footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        button {
            background: linear-gradient(135deg, #ffb347 0%, #ff9f2a 100%);
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 28px;
            border-radius: 40px;
            color: #2d1b0e;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #a45d2a;
            transform: translateY(-1px);
            touch-action: manipulation;
            flex: 0 0 auto;
            white-space: nowrap;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #a45d2a;
        }

        /* Адаптация для маленьких экранов */
        @media (max-width: 550px) {
            body {
                padding: 12px;
            }
            
            .game-container {
                padding: 12px;
            }
            
            .game-panel {
                padding: 15px;
            }
            
            .info {
                gap: 10px;
                margin: 15px 0 12px 0;
            }
            
            .score-box {
                padding: 6px 16px;
                font-size: 1.4rem;
            }
            
            .score-box span:first-child {
                font-size: 0.8rem;
            }
            
            .sound-toggle {
                padding: 6px 16px;
                font-size: 0.9rem;
            }
            
            .footer {
                gap: 12px;
                margin-top: 12px;
            }
            
            button {
                padding: 8px 20px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 450px) {
            .score-box {
                padding: 5px 12px;
                font-size: 1.2rem;
            }
            
            .score-box span:first-child {
                font-size: 0.7rem;
            }
            
            .sound-toggle {
                padding: 5px 12px;
                font-size: 0.8rem;
            }
            
            button {
                padding: 6px 16px;
                font-size: 0.85rem;
            }
        }

        @media (hover: hover) {
            .sound-toggle:hover {
                background: linear-gradient(135deg, #3a2518 0%, #2c1c12 100%);
                transform: scale(1.02);
            }
            
            button:hover {
                background: linear-gradient(135deg, #ffc267 0%, #ffae42 100%);
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-panel">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="info">
            <div class="score-box">
                <span>🍬 ОЧКИ</span> <span id="scoreValue">0</span>
            </div>
            <div class="sound-toggle" id="soundToggle">🔊 ЗВУК ВКЛ</div>
        </div>

        <div class="footer">
            <button id="resetButton">🔄 НОВАЯ ИГРА</button>
            <button id="hintButton">💡 ПОДСКАЗКА</button>
        </div>
    </div>
</div>

<script>
(function(){
    // ---------- НАСТРОЙКИ ----------
    const ROWS = 8;
    const COLS = 8;
    let TILE_SIZE = 50;
    const TYPES = 5;
    
    let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
    let score = 0;
    let selectedRow = -1, selectedCol = -1;
    let isProcessing = false;
    let soundEnabled = true;
    
    // Анимационные переменные
    let animatingCells = new Map();
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreValue');
    const soundToggle = document.getElementById('soundToggle');
    
    // Цвета и эмодзи
    const colors = ['#E76F51', '#F4A261', '#E9C46A', '#6A994E', '#A7C7E7'];
    const emojis = ['🍎', '🍊', '🍋', '🍏', '🫐'];
    
    // ---------- ЗВУКИ ----------
    class SoundEffects {
        constructor() {
            this.audioContext = null;
            this.initAudio();
        }
        
        initAudio() {
            try {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.log("Web Audio API не поддерживается");
                this.audioContext = null;
            }
        }
        
        playMove() {
            if (!soundEnabled || !this.audioContext) return;
            this.resumeAudioContext();
            const now = this.audioContext.currentTime;
            const osc = this.audioContext.createOscillator();
            const gain = this.audioContext.createGain();
            osc.connect(gain);
            gain.connect(this.audioContext.destination);
            osc.frequency.value = 523.25;
            gain.gain.value = 0.15;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
            osc.start();
            osc.stop(now + 0.15);
        }
        
        playMatch() {
            if (!soundEnabled || !this.audioContext) return;
            this.resumeAudioContext();
            const now = this.audioContext.currentTime;
            const osc = this.audioContext.createOscillator();
            const gain = this.audioContext.createGain();
            osc.connect(gain);
            gain.connect(this.audioContext.destination);
            osc.frequency.value = 659.25;
            gain.gain.value = 0.2;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
            osc.start();
            osc.stop(now + 0.2);
            
            setTimeout(() => {
                if (!soundEnabled || !this.audioContext) return;
                const osc2 = this.audioContext.createOscillator();
                const gain2 = this.audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(this.audioContext.destination);
                osc2.frequency.value = 783.99;
                gain2.gain.value = 0.15;
                gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
                osc2.start();
                osc2.stop(now + 0.3);
            }, 50);
        }
        
        playScore() {
            if (!soundEnabled || !this.audioContext) return;
            this.resumeAudioContext();
            const now = this.audioContext.currentTime;
            const osc = this.audioContext.createOscillator();
            const gain = this.audioContext.createGain();
            osc.connect(gain);
            gain.connect(this.audioContext.destination);
            osc.frequency.value = 880.00;
            gain.gain.value = 0.12;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
            osc.start();
            osc.stop(now + 0.18);
        }
        
        playHint() {
            if (!soundEnabled || !this.audioContext) return;
            this.resumeAudioContext();
            const now = this.audioContext.currentTime;
            const osc = this.audioContext.createOscillator();
            const gain = this.audioContext.createGain();
            osc.connect(gain);
            gain.connect(this.audioContext.destination);
            osc.frequency.value = 392.00;
            gain.gain.value = 0.1;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.start();
            osc.stop(now + 0.35);
        }
        
        playError() {
            if (!soundEnabled || !this.audioContext) return;
            this.resumeAudioContext();
            const now = this.audioContext.currentTime;
            const osc = this.audioContext.createOscillator();
            const gain = this.audioContext.createGain();
            osc.connect(gain);
            gain.connect(this.audioContext.destination);
            osc.frequency.value = 220.00;
            gain.gain.value = 0.1;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
            osc.start();
            osc.stop(now + 0.2);
        }
        
        resumeAudioContext() {
            if (this.audioContext && this.audioContext.state === 'suspended') {
                this.audioContext.resume();
            }
        }
    }
    
    const sounds = new SoundEffects();
    
    // ---------- АНИМАЦИИ ----------
    function updateCanvasSize() {
        const container = canvas.parentElement;
        const maxWidth = Math.min(container.clientWidth - 20, 500);
        const size = maxWidth;
        canvas.style.width = `${size}px`;
        canvas.style.height = `${size}px`;
        TILE_SIZE = size / ROWS;
        canvas.width = size;
        canvas.height = size;
    }
    
    function drawTile(x, y, type, offsetY = 0, scale = 1) {
        const cx = x * TILE_SIZE;
        const cy = y * TILE_SIZE + offsetY;
        const size = TILE_SIZE - 1;
        const color = colors[type % colors.length];
        
        ctx.save();
        if (scale !== 1) {
            ctx.translate(cx + TILE_SIZE/2, cy + TILE_SIZE/2);
            ctx.scale(scale, scale);
            ctx.translate(-(cx + TILE_SIZE/2), -(cy + TILE_SIZE/2));
        }
        
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.fillStyle = color;
        ctx.fillRect(cx, cy, size, size);
        
        const grad = ctx.createLinearGradient(cx, cy, cx+8, cy+8);
        grad.addColorStop(0, 'rgba(255,255,200,0.5)');
        grad.addColorStop(1, 'rgba(255,255,200,0.1)');
        ctx.fillStyle = grad;
        ctx.fillRect(cx, cy, size, size);
        
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx+1, cy+1, size-2, size-2);
        
        ctx.font = `bold ${TILE_SIZE * 0.48}px "Segoe UI Emoji", "Apple Color Emoji"`;
        ctx.fillStyle = '#2f2e2a';
        ctx.fillText(emojis[type % emojis.length], cx + TILE_SIZE*0.28, cy + TILE_SIZE*0.72);
        ctx.restore();
    }
    
    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < ROWS; i++) {
            for (let j = 0; j < COLS; j++) {
                const key = `${i},${j}`;
                const anim = animatingCells.get(key);
                let offsetY = 0;
                let scale = 1;
                if (anim) {
                    offsetY = anim.progress * (anim.endY - anim.startY);
                    if (anim.type === 'pop') {
                        scale = 1 + Math.sin(anim.progress * Math.PI) * 0.2;
                    }
                }
                drawTile(j, i, board[i][j], offsetY, scale);
            }
        }
        
        if (selectedRow !== -1 && selectedCol !== -1 && !isProcessing) {
            const x = selectedCol * TILE_SIZE;
            const y = selectedRow * TILE_SIZE;
            ctx.save();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#FFD966';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.rect(x+3, y+3, TILE_SIZE-7, TILE_SIZE-7);
            ctx.stroke();
            ctx.strokeStyle = '#f0a500';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(x+2, y+2, TILE_SIZE-5, TILE_SIZE-5);
            ctx.stroke();
            ctx.restore();
        }
    }
    
    function startGravityAnimation(column, fromRow, toRow) {
        const key = `${toRow},${column}`;
        animatingCells.set(key, {
            startY: (fromRow - toRow) * TILE_SIZE,
            endY: 0,
            progress: 0,
            type: 'fall'
        });
        
        let startTime = null;
        const duration = 150;
        
        function animateFall(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(1, elapsed / duration);
            
            const anim = animatingCells.get(key);
            if (anim) {
                anim.progress = progress;
                drawBoard();
            }
            
            if (progress < 1) {
                requestAnimationFrame(animateFall);
            } else {
                animatingCells.delete(key);
                drawBoard();
            }
        }
        
        requestAnimationFrame(animateFall);
    }
    
    function animatePop(row, col) {
        const key = `${row},${col}`;
        animatingCells.set(key, {
            startY: 0,
            endY: 0,
            progress: 0,
            type: 'pop'
        });
        
        let startTime = null;
        const duration = 200;
        
        function animatePopFrame(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(1, elapsed / duration);
            
            const anim = animatingCells.get(key);
            if (anim) {
                anim.progress = progress;
                drawBoard();
            }
            
            if (progress < 1) {
                requestAnimationFrame(animatePopFrame);
            } else {
                animatingCells.delete(key);
                drawBoard();
            }
        }
        
        requestAnimationFrame(animatePopFrame);
    }
    
    // ---------- ИГРОВАЯ ЛОГИКА ----------
    function getAllMatches() {
        const matches = new Set();
        
        for (let r = 0; r < ROWS; r++) {
            let len = 1;
            for (let c = 1; c < COLS; c++) {
                if (board[r][c] === board[r][c-1] && board[r][c] !== -1) {
                    len++;
                } else {
                    if (len >= 3) {
                        for (let i = c - len; i < c; i++) {
                            matches.add(`${r},${i}`);
                        }
                    }
                    len = 1;
                }
            }
            if (len >= 3) {
                for (let i = COLS - len; i < COLS; i++) {
                    matches.add(`${r},${i}`);
                }
            }
        }
        
        for (let c = 0; c < COLS; c++) {
            let len = 1;
            for (let r = 1; r < ROWS; r++) {
                if (board[r][c] === board[r-1][c] && board[r][c] !== -1) {
                    len++;
                } else {
                    if (len >= 3) {
                        for (let i = r - len; i < r; i++) {
                            matches.add(`${i},${c}`);
                        }
                    }
                    len = 1;
                }
            }
            if (len >= 3) {
                for (let i = ROWS - len; i < ROWS; i++) {
                    matches.add(`${i},${c}`);
                }
            }
        }
        
        return matches;
    }
    
    async function removeMatchesAndScore() {
        const matches = getAllMatches();
        if (matches.size === 0) return 0;
        
        for (const coord of matches) {
            const [row, col] = coord.split(',').map(Number);
            animatePop(row, col);
        }
        
        await delay(180);
        
        const pointsEarned = matches.size * 10;
        score += pointsEarned;
        updateScoreUI();
        sounds.playMatch();
        
        for (const coord of matches) {
            const [row, col] = coord.split(',').map(Number);
            board[row][col] = -1;
        }
        
        return matches.size;
    }
    
    async function applyGravityAndRefill() {
        for (let c = 0; c < COLS; c++) {
            const columnValues = [];
            
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] !== -1) {
                    columnValues.push(board[r][c]);
                }
            }
            
            while (columnValues.length < ROWS) {
                columnValues.push(Math.floor(Math.random() * TYPES));
            }
            
            columnValues.reverse();
            
            for (let r = 0; r < ROWS; r++) {
                const oldVal = board[r][c];
                const newVal = columnValues[r];
                board[r][c] = newVal;
                
                if (oldVal === -1 && newVal !== -1) {
                    startGravityAnimation(c, 0, r);
                }
            }
        }
        
        await delay(150);
    }
    
    async function settleBoardAndEarn() {
        if (isProcessing) return false;
        isProcessing = true;
        
        let hasChanges = true;
        let iterations = 0;
        const maxIterations = 20;
        
        while (hasChanges && iterations < maxIterations) {
            const removed = await removeMatchesAndScore();
            
            if (removed === 0) {
                hasChanges = false;
                break;
            }
            
            await applyGravityAndRefill();
            await delay(100);
            iterations++;
        }
        
        isProcessing = false;
        drawBoard();
        
        if (!isAnyMovePossible()) {
            await delay(300);
            shuffleBoardSmart();
            drawBoard();
            await settleBoardAndEarn();
        }
        
        return true;
    }
    
    function wouldMatchAfterSwap(r1, c1, r2, c2) {
        const temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;
        
        const hasMatch = getAllMatches().size > 0;
        
        const tempBack = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = tempBack;
        
        return hasMatch;
    }
    
    function isAnyMovePossible() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (c + 1 < COLS && wouldMatchAfterSwap(r, c, r, c + 1)) return true;
                if (r + 1 < ROWS && wouldMatchAfterSwap(r, c, r + 1, c)) return true;
            }
        }
        return false;
    }
    
    function shuffleBoardSmart() {
        for (let i = 0; i < ROWS; i++) {
            for (let j = 0; j < COLS; j++) {
                board[i][j] = Math.floor(Math.random() * TYPES);
            }
        }
        
        let attempts = 0;
        while (!isAnyMovePossible() && attempts < 100) {
            const r1 = Math.floor(Math.random() * ROWS);
            const c1 = Math.floor(Math.random() * COLS);
            const r2 = r1 + (Math.random() < 0.5 ? 1 : -1);
            const c2 = c1;
            
            if (r2 >= 0 && r2 < ROWS) {
                const temp = board[r1][c1];
                board[r1][c1] = board[r2][c2];
                board[r2][c2] = temp;
                
                if (isAnyMovePossible()) break;
                
                const tempBack = board[r1][c1];
                board[r1][c1] = board[r2][c2];
                board[r2][c2] = tempBack;
            }
            attempts++;
        }
    }
    
    async function trySwap(r1, c1, r2, c2) {
        if (isProcessing) return false;
        
        const isAdjacent = Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
        if (!isAdjacent) return false;
        
        if (!wouldMatchAfterSwap(r1, c1, r2, c2)) {
            sounds.playError();
            return false;
        }
        
        const temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;
        
        sounds.playMove();
        drawBoard();
        await delay(100);
        
        await settleBoardAndEarn();
        
        return true;
    }
    
    async function showHint() {
        if (isProcessing) return;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (c + 1 < COLS && wouldMatchAfterSwap(r, c, r, c + 1)) {
                    await highlightHint(r, c, r, c + 1);
                    return;
                }
                if (r + 1 < ROWS && wouldMatchAfterSwap(r, c, r + 1, c)) {
                    await highlightHint(r, c, r + 1, c);
                    return;
                }
            }
        }
        
        await delay(500);
        shuffleBoardSmart();
        drawBoard();
        await settleBoardAndEarn();
    }
    
    async function highlightHint(r1, c1, r2, c2) {
        sounds.playHint();
        
        for (let i = 0; i < 3; i++) {
            drawBoard();
            ctx.save();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#FFD966';
            ctx.lineWidth = 6;
            ctx.strokeRect(c1 * TILE_SIZE + 3, r1 * TILE_SIZE + 3, TILE_SIZE - 7, TILE_SIZE - 7);
            ctx.strokeRect(c2 * TILE_SIZE + 3, r2 * TILE_SIZE + 3, TILE_SIZE - 7, TILE_SIZE - 7);
            ctx.restore();
            await delay(250);
            drawBoard();
            await delay(150);
        }
    }
    
    async function resetGame() {
        if (isProcessing) return;
        
        isProcessing = true;
        score = 0;
        updateScoreUI();
        selectedRow = -1;
        selectedCol = -1;
        
        shuffleBoardSmart();
        drawBoard();
        
        await settleBoardAndEarn();
        isProcessing = false;
    }
    
    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    function updateScoreUI() {
        scoreSpan.innerText = score;
        sounds.playScore();
    }
    
    // ---------- ОБРАБОТЧИКИ ----------
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX, clientY;
        
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const canvasX = (clientX - rect.left) * scaleX;
        const canvasY = (clientY - rect.top) * scaleY;
        
        return {
            col: Math.floor(canvasX / TILE_SIZE),
            row: Math.floor(canvasY / TILE_SIZE)
        };
    }
    
    function handleCanvasTap(e) {
        if (isProcessing) return;
        
        e.preventDefault();
        
        const coords = getCanvasCoords(e);
        const row = coords.row;
        const col = coords.col;
        
        if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
        
        if (selectedRow === -1) {
            selectedRow = row;
            selectedCol = col;
            drawBoard();
        } else {
            trySwap(selectedRow, selectedCol, row, col);
            selectedRow = -1;
            selectedCol = -1;
            drawBoard();
        }
    }
    
    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function init() {
        updateCanvasSize();
        
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                updateCanvasSize();
                drawBoard();
            }, 100);
        });
        
        canvas.addEventListener('touchstart', handleCanvasTap, { passive: false });
        canvas.addEventListener('mousedown', handleCanvasTap);
        
        document.getElementById('resetButton').addEventListener('click', () => resetGame());
        document.getElementById('hintButton').addEventListener('click', () => showHint());
        
        soundToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (soundEnabled) {
                soundEnabled = false;
                soundToggle.innerHTML = '🔇 ЗВУК ВЫКЛ';
            } else {
                soundEnabled = true;
                sounds.resumeAudioContext();
                soundToggle.innerHTML = '🔊 ЗВУК ВКЛ';
                sounds.playMove();
            }
        });
        
        shuffleBoardSmart();
        drawBoard();
        setTimeout(() => settleBoardAndEarn(), 100);
    }
    
    init();
})();
</script>
</body>
</html>
